settings:
  commit:
    identity: user

media:
  - name: images
    label: 图片
    input: static/assets/img/posts
    output: /assets/img/posts
    extensions: [png, jpg, jpeg, webp, gif]
    rename: safe

content:
  - name: posts
    label: 文章
    type: collection
    path: content/posts
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    media: images
    operations:
      rename: false
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
        options:
          maxlength: 120

      - name: slug
        label: 文件名 slug
        description: 英文、数字和短横线。创建后修改不会自动改变已有 URL。
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        options:
          minlength: 3
          maxlength: 80

      - name: date
        label: 日期
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"

      - name: categories
        label: 分类
        type: string
        list: true

      - name: tags
        label: 标签
        type: string
        list: true

      - name: description
        label: 摘要
        type: text
        options:
          maxlength: 200

      - name: math
        label: 启用公式
        type: boolean
        default: false

      - name: comments
        label: 允许评论
        type: boolean
        default: true

      - name: pin
        label: 置顶
        type: boolean
        default: false

      - name: draft
        label: 草稿（不发布）
        type: boolean
        default: false

      - name: image
        label: 封面图
        type: image
        options:
          media: images

      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
          media: images
          switcher: true

  - name: about
    label: 关于
    type: file
    path: content/about.md
    format: yaml-frontmatter
    operations:
      create: false
      delete: false
      rename: false
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: layout
        label: 布局
        type: string
        hidden: true
        default: page
      - name: icon
        label: 图标
        type: string
        default: "fas fa-info-circle"
      - name: order
        label: 排序
        type: number
        default: 4
      - name: date
        label: 日期
        type: date
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - name: comments
        label: 允许评论
        type: boolean
        default: false
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
          switcher: true

  - name: archives
    label: 归档
    type: file
    path: content/archives.md
    format: yaml-frontmatter
    operations:
      create: false
      delete: false
      rename: false
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: layout
        label: 布局
        type: string
        hidden: true
        default: archives
      - name: icon
        label: 图标
        type: string
        default: "fas fa-archive"
      - name: order
        label: 排序
        type: number
        default: 3
      - name: date
        label: 日期
        type: date
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
